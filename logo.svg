<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradien Hijau Zamrud untuk Latar Belakang -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <!-- Gradien Emas Premium untuk Ikon & Bingkai -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <!-- Penapis Bayang (Drop Shadow) untuk Efek Kedalaman (Depth) -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Perisai Latar Belakang Bulatan Berbucu Lembut (Icon Base) -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Corak Geometri Bintang Islamik Tradisional (Latar Belakang Halus) -->
  <g stroke="url(#gold-grad)" stroke-width="3" fill="none" opacity="0.25">
    <rect x="64" y="64" width="384" height="384" rx="24" transform="rotate(0 256 256)" />
    <rect x="64" y="64" width="384" height="384" rx="24" transform="rotate(45 256 256)" />
  </g>

  <!-- Bingkai Emas Pekeliling yang Elegan -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold-grad)" stroke-width="6" filter="url(#drop-shadow)" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.6" />

  <!-- Kumpulan Elemen Utama Ikon (Dengan Bayang) -->
  <g filter="url(#drop-shadow)">
    <!-- Bulan Sabit (Simbol Iddah & Kalendar Hijrah) -->
    <path d="M 330 150 A 110 110 0 1 0 350 330 A 90 90 0 1 1 330 150" fill="url(#gold-grad)" opacity="0.9" />

    <!-- Kubah Masjid (Simbol Wali, Pernikahan & KUA) -->
    <path d="M 216 170 C 216 130, 296 130, 296 170 Z" fill="url(#gold-grad)" />
    <!-- Tiang Kubah / Bulan Bintang di Puncak -->
    <path d="M 256 135 L 256 105" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="100" r="5" fill="url(#gold-grad)" />
    
    <!-- Neraca Timbangan Syariah (Simbol Faraid/Pembagian Waris) -->
    <!-- Tiang Tengah -->
    <path d="M 252 165 L 252 360 C 252 365, 260 365, 260 360 L 260 165 Z" fill="url(#gold-grad)" />
    <!-- Tapak Neraca -->
    <path d="M 216 360 Q 256 350 296 360 L 286 370 Q 256 365 226 370 Z" fill="url(#gold-grad)" />
    
    <!-- Palang Melintang Neraca -->
    <path d="M 136 210 Q 256 195 376 210 L 376 218 Q 256 203 136 218 Z" fill="url(#gold-grad)" />
    <!-- Paksi Tengah -->
    <circle cx="256" cy="209" r="10" fill="url(#gold-grad)" />
    
    <!-- Mangkuk Neraca Kiri (Tali & Mangkuk) -->
    <g>
      <line x1="140" y1="214" x2="110" y2="285" stroke="url(#gold-grad)" stroke-width="3" />
      <line x1="140" y1="214" x2="170" y2="285" stroke="url(#gold-grad)" stroke-width="3" />
      <path d="M 100 285 Q 140 315 180 285 Q 180 280 100 280 Z" fill="url(#gold-grad)" />
    </g>

    <!-- Mangkuk Neraca Kanan (Tali & Mangkuk) -->
    <g>
      <line x1="372" y1="214" x2="342" y2="285" stroke="url(#gold-grad)" stroke-width="3" />
      <line x1="372" y1="214" x2="402" y2="285" stroke="url(#gold-grad)" stroke-width="3" />
      <path d="M 332 285 Q 372 315 412 285 Q 412 280 332 280 Z" fill="url(#gold-grad)" />
    </g>
  </g>

  <!-- Kerawang Hiasan Bawah yang Lembut -->
  <path d="M 216 410 Q 256 390 296 410 Q 256 430 216 410 Z" fill="url(#gold-grad)" opacity="0.8" />
</svg>
